[package]
name = "darbot-desktop"
version = "0.0.28"
description = "darbot Desktop"
edition = "2021"
rust-version = "1.94"

[lib]
name = "darbot_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "darbot-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
github-copilot-sdk = { version = "=2.0.1", default-features = false, package = "copilot-sdk", features = ["runtime"] }
async-trait = "0.1"
tokio = { version = "1", features = ["time", "net", "sync", "rt", "macros"] }
rand = "0.9"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
flate2 = "1"
zip = { version = "=9.7.0", default-features = false, features = ["deflate-flate2"] }
# Checking the digest of an installer before running it. See `install.rs`.
sha2 = "0.10"
tar = "0.4"
tauri-plugin-single-instance = "2.0.0-rc.5"
portable-pty = "0.9.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-dialog = "2"
regress = { version = "0.12.0", default-features = false, features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
subtle = "2"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
png = "0.17"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio", "service"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
schemars = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Storage_Xps", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
