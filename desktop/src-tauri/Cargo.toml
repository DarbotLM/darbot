[package]
name = "darbot-desktop"
version = "0.0.23"
description = "darbot Desktop"
edition = "2021"
rust-version = "1.94"

[lib]
name = "darbot_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "darbot-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
github-copilot-sdk = { version = "=2.0.1", default-features = false, package = "copilot-sdk", features = ["runtime"] }
async-trait = "0.1"
tokio = { version = "1", features = ["time"] }
rand = "0.9"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
flate2 = "1"
# Checking the digest of an installer before running it. See `install.rs`.
sha2 = "0.10"
tar = "0.4"
tauri-plugin-single-instance = "2.0.0-rc.5"
portable-pty = "0.9.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-dialog = "2"
regress = { version = "0.12.0", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
